version: '3.8'

services:
  # Flask Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stock-market-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/data/cache:/app/backend/data/cache
    networks:
      - stock-market-network
    restart: unless-stopped
    depends_on:
      - redis

  # Node.js Express API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stock-market-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./backend/data/cache:/app/backend/data/cache
    networks:
      - stock-market-network
    restart: unless-stopped
    depends_on:
      - backend

  # Next.js Web Frontend Service
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: stock-market-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost/api
    networks:
      - stock-market-network
    restart: unless-stopped
    depends_on:
      - backend
      - api

  # Vite React Client Service (optional, can also be served by nginx)
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: stock-market-client
    ports:
      - "8080:80"
    networks:
      - stock-market-network
    restart: unless-stopped
    depends_on:
      - backend
      - api

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: stock-market-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    networks:
      - stock-market-network
    restart: unless-stopped
    depends_on:
      - backend
      - api
      - web

  # Redis Cache Service (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: stock-market-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stock-market-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  stock-market-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
